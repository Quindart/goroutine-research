services:
  # Một broker chạy cả vai trò broker và controller, dùng KRaft nên không cần ZooKeeper.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      # Chương trình Go chạy trên máy host kết nối đến localhost:19092.
      - "127.0.0.1:19092:19092"
    environment:
      # Node duy nhất trong Kafka cluster demo.
      KAFKA_NODE_ID: 1
      # Chạy broker và controller chung trong một container để dễ học.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Listener kafka:9092 dành cho container cùng mạng; :19092 dành cho máy host.
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,PLAINTEXT_HOST://:19092
      # Client trong Docker nhận kafka:9092; client trên máy host nhận localhost:19092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Các topic nội bộ vẫn chạy được trên một broker trong môi trường demo.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Cluster ID cố định để Kafka KRaft khởi tạo metadata cho cluster local.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  # Giao diện web để xem topic, partition, consumer group và message.
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      # Mở UI trên máy local tại http://localhost:8080.
      - "127.0.0.1:8080:8080"
    # Khởi động container Kafka trước container UI.
    depends_on:
      - kafka
    environment:
      # Tên cluster hiển thị trong Kafbat UI.
      KAFKA_CLUSTERS_0_NAME: local-demo
      # UI chạy trong Docker nên phải dùng DNS service Kafka, không dùng localhost.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
